apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-hotel-deployer-binding
  namespace: hotel
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  kind: Role
  name: argocd-hotel-deployer
  apiGroup: rbac.authorization.k8s.io