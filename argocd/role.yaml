apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-hotel-deployer
  namespace: hotel
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch", "create"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "update", "patch", "create"]